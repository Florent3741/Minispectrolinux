name: Build Linux Executable
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          pip install pyserial matplotlib numpy pyinstaller
      - name: Build MiniSpectro
        run: pyinstaller --onefile --windowed --hidden-import="PIL._tkinter_finder" --name "MiniSpectro" minispectro.py
      - name: Upload file
        uses: actions/upload-artifact@v4
        with:
          name: MiniSpectro-Linux
          path: dist/MiniSpectro
